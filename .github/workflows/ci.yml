name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  library:
    name: library (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Install the built wheel, not the source tree, so the tests see exactly
      # what PyPI users get (core deps only, plus the optional extras).
      - name: Build and install wheel
        run: |
          uv build --package traits-audit -o dist
          uv pip install --system "$(ls dist/*.whl)[dev,stability]"

      - name: Run library tests
        working-directory: packages/traits-audit
        run: pytest tests/ -v --cov=traits_audit --cov-report=xml

      - name: Quickstart smoke test
        run: ta-demo --steps 20 --seed 0

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: packages/traits-audit/coverage.xml
          fail_ci_if_error: false

  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install workspace (locked) with experiment extras
        run: uv sync --locked --all-packages --extra mobo --extra committee

      - name: Run experiment tests
        run: uv run --no-sync pytest experiments/nmi2026/tests -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install package with docs extras
        run: uv pip install --system "./packages/traits-audit[docs]"

      - name: Build Sphinx docs
        run: make -C docs html SPHINXOPTS="-W"
