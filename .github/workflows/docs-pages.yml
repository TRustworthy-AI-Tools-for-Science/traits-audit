name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Demos 03 (BoTorch), 07 (MLflow) and 08 (scikit-optimize) need extras.
      # CPU-only torch keeps the install small.
      - name: Install CPU-only torch
        run: uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with docs extras and demo dependencies
        run: uv pip install --system "./packages/traits-audit[docs,mlflow]" botorch scikit-optimize

      # Strict: a demo whose optional dependency is missing fails the build
      # instead of being rendered without running.
      - name: Build Sphinx docs
        env:
          TRAITS_AUDIT_DEMOS_STRICT: "1"
        run: make -C docs html SPHINXOPTS="-W"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
